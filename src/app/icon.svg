<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#faf7f2" stroke="#d4c4b0" stroke-width="1.5"/>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#d4a574" stroke-width="3" opacity="0.7"/>
  <!-- Inner ring -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="#c49a6c" stroke-width="2" opacity="0.5"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="8" fill="#e8ddd0" stroke="#c49a6c" stroke-width="1"/>
  <!-- Musical note in center -->
  <text x="32" y="37" text-anchor="middle" font-size="16" font-weight="bold" fill="#5a3a1a" font-family="serif">♪</text>
  <!-- Tick marks around outer ring (12 positions like a clock) -->
  <g stroke="#b8956a" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <line x1="32" y1="4" x2="32" y2="9"/>
    <line x1="46" y1="7.1" x2="43.5" y2="11.4"/>
    <line x1="56.9" y1="18" x2="52.6" y2="20.5"/>
    <line x1="60" y1="32" x2="55" y2="32"/>
    <line x1="56.9" y1="46" x2="52.6" y2="43.5"/>
    <line x1="46" y1="56.9" x2="43.5" y2="52.6"/>
    <line x1="32" y1="60" x2="32" y2="55"/>
    <line x1="18" y1="56.9" x2="20.5" y2="52.6"/>
    <line x1="7.1" y1="46" x2="11.4" y2="43.5"/>
    <line x1="4" y1="32" x2="9" y2="32"/>
    <line x1="7.1" y1="18" x2="11.4" y2="20.5"/>
    <line x1="18" y1="7.1" x2="20.5" y2="11.4"/>
  </g>
</svg>
